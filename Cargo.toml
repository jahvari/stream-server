[workspace]
resolver = "2"
members = [
    "enginefs",
    "server",
    "bindings/async-rar",
    "bindings/libtorrent-sys",
    "bindings/async-sevenz",
    "stremio-runtime-stub",
    "updater-helper",
    "settings-gui",
    # Test-only FFmpeg/ffprobe process fixture; not referenced by release/package metadata.
    "test-support/fake-media-tool",
]

[workspace.package]
rust-version = "1.98"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
